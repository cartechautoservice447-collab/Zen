name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build and publish Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # Keep the debug signing key stable between builds so updated APKs can
      # install over previous APKs produced by this workflow.
      - name: Restore debug signing key
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: learnly-android-debug-keystore-v1

      - name: Create debug signing key if missing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: "Android APK build ${{ github.run_number }}"
          body: |
            Automatically built Android APK from the main branch.

            This is a debug-signed APK for testing, not a Play Store production release.
          make_latest: true
          files: app/build/outputs/apk/debug/app-debug.apk
